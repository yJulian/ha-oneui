# One UI 9 inspired. Install using frontend.themes; no custom cards required.
# Palette values are an interpretation, not official Samsung design tokens.
One UI:
  # Prefer the locally available Galaxy font; never download proprietary fonts.
  ha-font-family-body: '"One UI Sans", "SamsungOne", "Roboto", system-ui, sans-serif'
  ha-font-family-heading: 'var(--ha-font-family-body)'
  primary-font-family: 'var(--ha-font-family-body)'
  paper-font-common-base_-_font-family: 'var(--ha-font-family-body)'
  paper-font-common-code_-_font-family: 'monospace'
  mdc-typography-font-family: 'var(--ha-font-family-body)'

  # Soft surfaces and generous corners, without changing touch target sizes.
  ha-card-border-radius: '28px'
  ha-card-border-width: '0px'
  ha-card-box-shadow: 'none'
  ha-card-header-font-size: '22px'
  ha-card-header-font-family: 'var(--ha-font-family-heading)'
  ha-dialog-border-radius: '28px'
  mdc-shape-small: '12px'
  mdc-shape-medium: '20px'
  mdc-shape-large: '28px'
  ha-view-sections-column-gap: '16px'
  ha-view-sections-row-gap: '16px'

  # Semantic aliases also cover older Material-based frontend components.
  accent-color: 'var(--primary-color)'
  ha-card-background: 'var(--card-background-color)'
  lovelace-background: 'var(--primary-background-color)'
  ha-card-header-color: 'var(--primary-text-color)'
  app-header-background-color: 'var(--primary-background-color)'
  app-header-text-color: 'var(--primary-text-color)'
  sidebar-background-color: 'var(--card-background-color)'
  sidebar-text-color: 'var(--primary-text-color)'
  sidebar-icon-color: 'var(--secondary-text-color)'
  sidebar-selected-text-color: 'var(--primary-color)'
  sidebar-selected-icon-color: 'var(--primary-color)'
  paper-item-icon-color: 'var(--secondary-text-color)'
  paper-item-icon-active-color: 'var(--primary-color)'
  state-icon-color: 'var(--secondary-text-color)'
  state-icon-active-color: 'var(--primary-color)'
  state-active-color: 'var(--primary-color)'
  state-inactive-color: 'var(--secondary-text-color)'
  # Keep Home Assistant's domain-specific warning, lock and alarm state colors.
  state-light-active-color: 'var(--one-ui-yellow)'
  state-switch-active-color: 'var(--primary-color)'
  state-input_boolean-active-color: 'var(--primary-color)'
  state-fan-active-color: 'var(--one-ui-teal)'
  state-media_player-active-color: 'var(--primary-color)'
  disabled-color: 'var(--disabled-text-color)'
  paper-listbox-background-color: 'var(--card-background-color)'
  paper-listbox-color: 'var(--primary-text-color)'
  mdc-theme-primary: 'var(--primary-color)'
  mdc-theme-secondary: 'var(--primary-color)'
  mdc-theme-background: 'var(--primary-background-color)'
  mdc-theme-surface: 'var(--card-background-color)'
  mdc-theme-on-surface: 'var(--primary-text-color)'
  mdc-theme-on-primary: 'var(--text-primary-color)'
  mdc-theme-on-secondary: 'var(--text-primary-color)'
  mdc-theme-text-primary-on-background: 'var(--primary-text-color)'
  mdc-theme-text-secondary-on-background: 'var(--secondary-text-color)'
  mdc-theme-text-disabled-on-background: 'var(--disabled-text-color)'
  mdc-theme-error: 'var(--error-color)'
  input-fill-color: 'var(--secondary-background-color)'
  input-ink-color: 'var(--primary-text-color)'
  input-label-ink-color: 'var(--secondary-text-color)'
  input-disabled-ink-color: 'var(--disabled-text-color)'
  input-dropdown-icon-color: 'var(--secondary-text-color)'
  input-idle-line-color: 'var(--divider-color)'
  input-hover-line-color: 'var(--secondary-text-color)'
  input-disabled-fill-color: 'var(--secondary-background-color)'
  input-disabled-line-color: 'var(--divider-color)'
  paper-slider-active-color: 'var(--primary-color)'
  paper-slider-knob-color: 'var(--primary-color)'
  paper-slider-container-color: 'var(--one-ui-track)'
  switch-checked-color: 'var(--primary-color)'
  switch-checked-button-color: 'var(--text-primary-color)'
  switch-checked-track-color: 'var(--primary-color)'
  switch-unchecked-button-color: 'var(--card-background-color)'
  switch-unchecked-track-color: 'var(--one-ui-track)'

  modes:
    light:
      primary-color: '#174BCB'
      light-primary-color: '#DFE8FF'
      dark-primary-color: '#123BA1'
      primary-background-color: '#F2F3F5'
      secondary-background-color: '#E9EBEF'
      card-background-color: '#FFFFFF'
      primary-text-color: '#17181B'
      secondary-text-color: '#555963'
      text-primary-color: '#FFFFFF'
      disabled-text-color: '#767B85'
      divider-color: '#D9DCE2'
      ha-card-border-color: '#D9DCE2'
      error-color: '#B3261E'
      warning-color: '#865500'
      success-color: '#217148'
      info-color: '#174BCB'
      one-ui-yellow: '#906600'
      one-ui-teal: '#087B77'
      one-ui-track: '#CDD2DC'
      clear-background-color: '#F2F3F5'
    dark:
      primary-color: '#9DBAFF'
      light-primary-color: '#253653'
      dark-primary-color: '#719BFF'
      primary-background-color: '#000000'
      secondary-background-color: '#292A2E'
      card-background-color: '#1C1D21'
      primary-text-color: '#F5F5F7'
      secondary-text-color: '#B9BDC7'
      text-primary-color: '#10204A'
      disabled-text-color: '#90949E'
      divider-color: '#3B3D44'
      ha-card-border-color: '#3B3D44'
      error-color: '#FFB4AB'
      warning-color: '#FFD080'
      success-color: '#8DD9AC'
      info-color: '#9DBAFF'
      one-ui-yellow: '#FFD36E'
      one-ui-teal: '#79D9D1'
      one-ui-track: '#555B68'
      clear-background-color: '#000000'
